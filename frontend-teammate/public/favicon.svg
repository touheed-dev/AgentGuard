<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Left shield gradient (Deep Emerald) -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044E3F" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Right shield gradient (Warm Champagne / Stone) -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2DCD1" />
      <stop offset="50%" stop-color="#C5BBAE" />
      <stop offset="100%" stop-color="#9E9284" />
    </linearGradient>

    <!-- Star core gradient (Vibrant Emerald Teal) -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Charcoal 'A' chevron gradient -->
    <linearGradient id="chevronCharcoal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D333B" />
      <stop offset="100%" stop-color="#181D24" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Shield Facet -->
  <path d="M 60 12 L 24 28 L 24 64 C 24 86 60 106 60 106 Z" 
        fill="url(#shieldLeft)" />

  <!-- Right Shield Facet -->
  <path d="M 60 12 L 96 28 L 96 64 C 96 86 60 106 60 106 Z" 
        fill="url(#shieldRight)" />

  <!-- Shield Inner Cutout / Masking Effect (Left Facet Inner) -->
  <path d="M 60 22 L 32 35 L 32 62 C 32 79 60 95 60 95 Z" 
        fill="#F5F0E8" />

  <!-- Shield Inner Cutout / Masking Effect (Right Facet Inner) -->
  <path d="M 60 22 L 88 35 L 88 62 C 88 79 60 95 60 95 Z" 
        fill="#EDE8DE" />

  <!-- The Central 'A' Chevron (Obsidian Charcoal) -->
  <path d="M 60 34 L 84 74 L 72 74 L 60 52 L 48 74 L 36 74 Z" 
        fill="url(#chevronCharcoal)" 
        filter="url(#subtleGlow)" />

  <!-- Central Star / Spark at core -->
  <!-- 4-point Diamond Star -->
  <path d="M 60 66 Q 60 74 68 74 Q 60 74 60 82 Q 60 74 52 74 Q 60 74 60 66 Z" 
        fill="url(#starGrad)" />
</svg>