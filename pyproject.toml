[project]
name = "agentguard"
version = "0.1.0"
description = "Deterministic runtime security gateway for autonomous agents"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<47",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "greenlet>=3.0,<4",
    "networkx>=3.0,<4",
    "PyJWT>=2.9,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "rfc8785>=0.1.2,<1",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "hypothesis>=6.115,<7",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
]
quality = [
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
